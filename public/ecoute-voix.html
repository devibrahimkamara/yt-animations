<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voix AIsa</title>
<style>:root{--bg:#0b0f1e;--card:#151b33;--ink:#eef1ff;--mut:#8a94b8;--acc:#3060ff}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:24px 16px 110px;max-width:860px;margin:auto}
h1{margin:0 0 6px}.d{color:var(--mut);margin:0 0 18px}.card{display:block;background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer}.card:has(input:checked){border-color:var(--acc)}
.h{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.t{font-weight:700;font-size:18px}.m{color:var(--mut);font-size:14px}.h input{width:22px;height:22px}audio{width:100%}
#bar{position:fixed;left:0;right:0;bottom:0;background:#0b0f1ee8;border-top:1px solid #2a3360;padding:12px 16px;display:flex;gap:10px;align-items:center}#out{flex:1;color:var(--mut);font-size:13px}button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}</style></head>
<body><h1>Ta voix — 4 versions</h1><p class="d">Même extrait de 30 s, même volume pour les 4 (comparaison juste). Écoute <b>au casque puis sur le haut-parleur du téléphone</b>, choisis ta préférée, puis « Copier mon choix ».</p><label class="card"><div class="h"><div><div class="t">A · Originale</div><div class="m">Ton audio d'origine, seulement remonté au bon volume (aucun traitement).</div></div><input type="radio" name="v" value="A · Originale"></div><audio controls preload="none" src="voix/A_originale.mp3"></audio></label><label class="card"><div class="h"><div><div class="t">B · Traitement actuel</div><div class="m">Ce que tu as entendu dans le prototype (débruitage basique + compression).</div></div><input type="radio" name="v" value="B · Traitement actuel"></div><audio controls preload="none" src="voix/B_traitement_actuel.mp3"></audio></label><label class="card"><div class="h"><div><div class="t">C · IA douce</div><div class="m">Débruitage IA DeepFilterNet limité (garde le naturel) + compression très légère.</div></div><input type="radio" name="v" value="C · IA douce"></div><audio controls preload="none" src="voix/C_ia_doux.mp3"></audio></label><label class="card"><div class="h"><div><div class="t">D · IA « broadcast »</div><div class="m">Débruitage IA complet + égalisation (moins de boue, plus de présence) + de-esser + compression.</div></div><input type="radio" name="v" value="D · IA « broadcast »"></div><audio controls preload="none" src="voix/D_ia_broadcast.mp3"></audio></label>
<div id="bar"><div id="out">Aucune version choisie</div><button id="cp">Copier mon choix</button></div>
<script>const out=document.getElementById('out');const sel=()=>(document.querySelector('input:checked')||{}).value;
document.addEventListener('change',()=>{out.textContent=sel()||'Aucune version choisie'});document.addEventListener('play',e=>{document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
document.getElementById('cp').onclick=async()=>{const t='Voix AIsa : '+(sel()||'?');try{await navigator.clipboard.writeText(t);out.textContent='Copié ✓'}catch(e){out.textContent=t}};</script></body></html>
