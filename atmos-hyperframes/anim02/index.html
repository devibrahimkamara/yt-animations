<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #030818;
        font-family: "Plus Jakarta Sans", sans-serif;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
      }

      /* ── AURORA ─────────────────────────────────────────────── */
      .aurora {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .aurora-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(150px);
      }
      .blob-1 { width: 800px; height: 800px; background: rgba(20,60,220,0.65); top: -250px; left: -150px; }
      .blob-2 { width: 650px; height: 650px; background: rgba(40,90,255,0.5); bottom: -200px; right: -100px; }
      .blob-3 { width: 500px; height: 500px; background: rgba(255,215,0,0.12); top: 50%; left: 50%; transform: translate(-50%,-50%); }

      /* ── GRID LINES (decorative) ─────────────────────────────── */
      .grid-lines {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.06;
      }
      .grid-lines svg { width: 100%; height: 100%; }

      /* ── MAIN STAGE ─────────────────────────────────────────── */
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 5;
      }

      /* Top label */
      .top-label {
        font-size: 52px;
        font-weight: 700;
        color: rgba(136,170,255,0.8);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 40px;
      }

      /* ── SLOT MACHINE FRAME ─────────────────────────────────── */
      .slot-frame {
        position: relative;
        width: 900px;
        background: linear-gradient(150deg, rgba(20,40,120,0.7) 0%, rgba(8,16,60,0.85) 100%);
        border: 2px solid rgba(80,130,255,0.3);
        border-radius: 36px;
        padding: 48px 60px 56px;
        box-shadow:
          0 0 80px rgba(48,96,255,0.22),
          0 0 160px rgba(48,96,255,0.08),
          inset 0 1px 0 rgba(255,255,255,0.08);
        overflow: hidden;
      }

      /* Glass sheen overlay */
      .slot-sheen {
        position: absolute;
        top: 0; left: 0; right: 0; height: 50%;
        background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
        border-radius: 36px 36px 0 0;
        pointer-events: none;
      }

      /* Drum viewport — clips the scrolling numbers */
      .drum-viewport {
        height: 180px;
        overflow: hidden;
        position: relative;
        margin-bottom: 24px;
      }

      /* Drum strip — contains all number states stacked vertically */
      .drum-strip {
        display: flex;
        flex-direction: column;
        align-items: center;
        will-change: transform;
      }

      .drum-number {
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 148px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .num-0    { color: rgba(136,170,255,0.3); }
      .num-3000 { color: #3060ff; text-shadow: 0 0 60px rgba(48,96,255,0.8); }
      .num-4000 { color: #22c55e; text-shadow: 0 0 60px rgba(34,197,94,0.8); }
      .num-5000 { color: #ffd700; text-shadow: 0 0 60px rgba(255,215,0,0.9); }

      /* Horizontal scanline across drum center */
      .drum-scanline-top {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: rgba(80,130,255,0.35);
      }
      .drum-scanline-bot {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 1px;
        background: rgba(80,130,255,0.35);
      }

      /* Period label */
      .period-label {
        font-size: 42px;
        font-weight: 700;
        color: rgba(136,170,255,0.7);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 40px;
      }

      /* ── CONFIRMATION BARS ──────────────────────────────────── */
      .confirm-bars {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }

      .confirm-bar {
        height: 5px;
        background: rgba(255,255,255,0.06);
        border-radius: 50px;
        overflow: hidden;
        position: relative;
      }

      .confirm-fill {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 0%;
        border-radius: 50px;
      }

      .fill-blue  { background: linear-gradient(90deg, #3060ff, #88aaff); box-shadow: 0 0 12px rgba(48,96,255,0.6); }
      .fill-green { background: linear-gradient(90deg, #22c55e, #86efac); box-shadow: 0 0 12px rgba(34,197,94,0.6); }
      .fill-gold  { background: linear-gradient(90deg, #ffd700, #fffaaa); box-shadow: 0 0 12px rgba(255,215,0,0.7); }

      /* ── MILESTONE BADGES ───────────────────────────────────── */
      .badges {
        display: flex;
        gap: 28px;
        margin-top: 48px;
      }

      .badge {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.03);
        border: 1.5px solid rgba(255,255,255,0.07);
        border-radius: 24px;
        padding: 28px 40px;
        opacity: 0;
      }

      .badge-value {
        font-size: 52px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }

      .badge-tag {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(136,170,255,0.75);
      }

      .badge-blue  { border-color: rgba(48,96,255,0.4); background: rgba(48,96,255,0.07); }
      .badge-green { border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.07); }
      .badge-gold  { border-color: rgba(255,215,0,0.4); background: rgba(255,215,0,0.07); }

      .badge-blue .badge-value  { color: #3060ff; }
      .badge-green .badge-value { color: #22c55e; }
      .badge-gold .badge-value  { color: #ffd700; }

      /* ── BURST PARTICLES ────────────────────────────────────── */
      .particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .particle {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        opacity: 0;
      }

      /* Reg marks */
      .reg { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
      .rc { position: absolute; width: 24px; height: 24px; opacity: 0.2; }
      .rc.tl { top: 28px; left: 28px; border-top: 2px solid rgba(136,170,255,0.8); border-left: 2px solid rgba(136,170,255,0.8); }
      .rc.tr { top: 28px; right: 28px; border-top: 2px solid rgba(136,170,255,0.8); border-right: 2px solid rgba(136,170,255,0.8); }
      .rc.bl { bottom: 28px; left: 28px; border-bottom: 2px solid rgba(136,170,255,0.8); border-left: 2px solid rgba(136,170,255,0.8); }
      .rc.br { bottom: 28px; right: 28px; border-bottom: 2px solid rgba(136,170,255,0.8); border-right: 2px solid rgba(136,170,255,0.8); }

      /* Side decorative labels */
      .side-label {
        position: absolute;
        font-size: 18px;
        font-weight: 600;
        color: rgba(136,170,255,0.25);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        writing-mode: vertical-rl;
        z-index: 2;
      }
      .side-label.left  { left: 40px; top: 50%; transform: translateY(-50%) rotate(180deg); }
      .side-label.right { right: 40px; top: 50%; transform: translateY(-50%); }
    </style>
  </head>
  <body>
    <div data-composition-id="atmos-anim02" data-start="0" data-width="1920" data-height="1080">

      <!-- Aurora -->
      <div class="aurora">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
      </div>

      <!-- Decorative grid -->
      <div class="grid-lines">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <!-- Vertical lines -->
          <line x1="240" y1="0" x2="240" y2="1080" stroke="rgba(136,170,255,1)" stroke-width="1"/>
          <line x1="480" y1="0" x2="480" y2="1080" stroke="rgba(136,170,255,1)" stroke-width="1"/>
          <line x1="720" y1="0" x2="720" y2="1080" stroke="rgba(136,170,255,1)" stroke-width="1"/>
          <line x1="960" y1="0" x2="960" y2="1080" stroke="rgba(136,170,255,1)" stroke-width="1"/>
          <line x1="1200" y1="0" x2="1200" y2="1080" stroke="rgba(136,170,255,1)" stroke-width="1"/>
          <line x1="1440" y1="0" x2="1440" y2="1080" stroke="rgba(136,170,255,1)" stroke-width="1"/>
          <line x1="1680" y1="0" x2="1680" y2="1080" stroke="rgba(136,170,255,1)" stroke-width="1"/>
          <!-- Horizontal lines -->
          <line x1="0" y1="216" x2="1920" y2="216" stroke="rgba(136,170,255,1)" stroke-width="1"/>
          <line x1="0" y1="432" x2="1920" y2="432" stroke="rgba(136,170,255,1)" stroke-width="1"/>
          <line x1="0" y1="648" x2="1920" y2="648" stroke="rgba(136,170,255,1)" stroke-width="1"/>
          <line x1="0" y1="864" x2="1920" y2="864" stroke="rgba(136,170,255,1)" stroke-width="1"/>
        </svg>
      </div>

      <!-- Reg marks -->
      <div class="reg">
        <div class="rc tl"></div><div class="rc tr"></div>
        <div class="rc bl"></div><div class="rc br"></div>
      </div>

      <!-- Side labels -->
      <div class="side-label left">Potentiel mensuel</div>
      <div class="side-label right">Apps SaaS 2026</div>

      <!-- Particles -->
      <div class="particles" id="particles">
        <!-- Generated by JS -->
      </div>

      <!-- Main stage -->
      <div class="stage">
        <div class="top-label" id="top-label">Revenus mensuels estimés</div>

        <!-- Slot machine card -->
        <div class="slot-frame" id="slot-frame">
          <div class="slot-sheen"></div>

          <!-- Drum window -->
          <div class="drum-viewport">
            <div class="drum-scanline-top"></div>
            <div class="drum-scanline-bot"></div>
            <div class="drum-strip" id="drum-strip">
              <div class="drum-number num-0">0€</div>
              <div class="drum-number num-3000">3 000€</div>
              <div class="drum-number num-4000">4 000€</div>
              <div class="drum-number num-5000">5 000€</div>
            </div>
          </div>

          <!-- /mois label -->
          <div class="period-label" id="period-label">par mois 💰</div>

          <!-- Progress bars -->
          <div class="confirm-bars">
            <div class="confirm-bar"><div class="confirm-fill fill-blue"  id="bar-1"></div></div>
            <div class="confirm-bar"><div class="confirm-fill fill-green" id="bar-2"></div></div>
            <div class="confirm-bar"><div class="confirm-fill fill-gold"  id="bar-3"></div></div>
          </div>
        </div>

        <!-- Milestone badges -->
        <div class="badges">
          <div class="badge badge-blue"  id="badge-1">
            <div class="badge-value">3 000€</div>
            <div class="badge-tag">Débutant</div>
          </div>
          <div class="badge badge-green" id="badge-2">
            <div class="badge-value">4 000€</div>
            <div class="badge-tag">Régulier</div>
          </div>
          <div class="badge badge-gold"  id="badge-3">
            <div class="badge-value">5 000€</div>
            <div class="badge-tag">Objectif</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        const duration = 12;

        // Seeded PRNG for deterministic particles
        function mulberry32(a) {
          return function() {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            var t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
          }
        }
        const rand = mulberry32(42);

        // Build particles
        const particleContainer = document.getElementById('particles');
        const particleColors = ['#3060ff','#ffd700','#22c55e','#88aaff','#fffaaa'];
        for (let i = 0; i < 40; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          p.style.left = (300 + rand() * 1320) + 'px';
          p.style.top = (200 + rand() * 680) + 'px';
          p.style.background = particleColors[Math.floor(rand() * 5)];
          p.style.width = (4 + rand() * 10) + 'px';
          p.style.height = p.style.width;
          p.id = 'p' + i;
          particleContainer.appendChild(p);
        }

        const tl = gsap.timeline({ paused: true });

        // Aurora ambient
        tl.to('.blob-1', { x: 80, y: 50, duration: 3.0, ease: 'sine.inOut', yoyo: true, repeat: Math.floor(duration/3.0)-1 }, 0);
        tl.to('.blob-2', { x: -60, y: -40, duration: 3.6, ease: 'sine.inOut', yoyo: true, repeat: Math.floor(duration/3.6)-1 }, 0.5);
        tl.to('.blob-3', { scale: 1.4, opacity: 0.3, duration: 2.8, ease: 'sine.inOut', yoyo: true, repeat: Math.floor(duration/2.8)-1 }, 0.2);

        // Reg marks
        tl.fromTo('.reg', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power1.out' }, 0.1);
        tl.fromTo('.side-label', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.2);
        tl.fromTo('.grid-lines', { opacity: 0 }, { opacity: 0.06, duration: 0.8, ease: 'power1.out' }, 0.1);

        // Top label
        tl.fromTo('#top-label',
          { opacity: 0, y: -20 },
          { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' },
          0.3
        );

        // Slot frame entrance
        tl.fromTo('#slot-frame',
          { opacity: 0, scale: 0.88, y: 30 },
          { opacity: 1, scale: 1, y: 0, duration: 0.9, ease: 'expo.out' },
          0.5
        );

        // Slot frame ambient glow
        tl.to('#slot-frame', {
          boxShadow: '0 0 100px rgba(48,96,255,0.35), 0 0 200px rgba(48,96,255,0.12), inset 0 1px 0 rgba(255,255,255,0.08)',
          duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: Math.floor(duration/1.8)-1
        }, 1.2);

        // Period label
        tl.fromTo('#period-label',
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.6)' },
          1.0
        );

        // ── DRUM ROLL: 0 → 3000€ ────────────────────────────────
        // Each slot is 180px tall. Strip starts at y=0 (showing "0€").
        // Going to 3000€ = translateY(-180px), 4000€ = -360px, 5000€ = -540px

        // Fast spin effect then land on 3000€
        tl.fromTo('#drum-strip',
          { y: 0 },
          { y: -900, duration: 0.6, ease: 'power3.in' },
          1.8
        );
        tl.to('#drum-strip',
          { y: -180, duration: 0.5, ease: 'expo.out' },
          2.4
        );

        // Bar 1 fills
        tl.to('#bar-1', { width: '100%', duration: 0.7, ease: 'power2.out' }, 2.7);

        // Badge 1 pops in
        tl.fromTo('#badge-1',
          { opacity: 0, scale: 0.6, y: 20 },
          { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: 'back.out(2)' },
          3.1
        );

        // Glow flash: slot frame turns blue
        tl.to('#slot-frame', { borderColor: 'rgba(48,96,255,0.9)', duration: 0.15, ease: 'power3.out' }, 2.9);
        tl.to('#slot-frame', { borderColor: 'rgba(80,130,255,0.3)', duration: 0.5, ease: 'power2.out' }, 3.05);

        // ── DRUM ROLL: 3000 → 4000€ ──────────────────────────────
        tl.to('#drum-strip',
          { y: -900 - 180, duration: 0.55, ease: 'power3.in' },
          4.2
        );
        tl.to('#drum-strip',
          { y: -360, duration: 0.5, ease: 'expo.out' },
          4.75
        );

        // Bar 2 fills
        tl.to('#bar-2', { width: '100%', duration: 0.7, ease: 'power2.out' }, 5.1);

        // Badge 2
        tl.fromTo('#badge-2',
          { opacity: 0, scale: 0.6, y: 20 },
          { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: 'back.out(2)' },
          5.4
        );

        // Green glow flash
        tl.to('#slot-frame', { borderColor: 'rgba(34,197,94,0.9)', duration: 0.15 }, 5.2);
        tl.to('#slot-frame', { borderColor: 'rgba(80,130,255,0.3)', duration: 0.5 }, 5.35);

        // ── DRUM ROLL: 4000 → 5000€ ──────────────────────────────
        tl.to('#drum-strip',
          { y: -360 - 900, duration: 0.5, ease: 'power3.in' },
          6.5
        );
        tl.to('#drum-strip',
          { y: -540, duration: 0.55, ease: 'expo.out' },
          7.0
        );

        // Bar 3 fills
        tl.to('#bar-3', { width: '100%', duration: 0.8, ease: 'power2.out' }, 7.3);

        // Badge 3 — biggest pop
        tl.fromTo('#badge-3',
          { opacity: 0, scale: 0.5, y: 20 },
          { opacity: 1, scale: 1.12, y: 0, duration: 0.4, ease: 'back.out(2.5)' },
          7.7
        );
        tl.to('#badge-3', { scale: 1, duration: 0.3, ease: 'power2.out' }, 8.1);

        // Gold glow BURST on slot frame
        tl.to('#slot-frame', {
          borderColor: 'rgba(255,215,0,0.95)',
          boxShadow: '0 0 120px rgba(255,215,0,0.45), 0 0 240px rgba(255,215,0,0.18)',
          duration: 0.2
        }, 7.6);
        tl.to('#slot-frame', {
          borderColor: 'rgba(80,130,255,0.3)',
          boxShadow: '0 0 80px rgba(48,96,255,0.22), 0 0 160px rgba(48,96,255,0.08)',
          duration: 1.2, ease: 'power2.out'
        }, 7.8);

        // Aurora gold blob intensifies
        tl.to('.blob-3', { opacity: 0.45, scale: 2.2, duration: 0.8, ease: 'power2.out' }, 7.5);
        tl.to('.blob-3', { opacity: 0.12, scale: 1, duration: 1.4, ease: 'power2.inOut' }, 8.3);

        // ── PARTICLES BURST at 5000€ ─────────────────────────────
        const particleEls = particleContainer.querySelectorAll('.particle');
        const rand2 = mulberry32(99);
        particleEls.forEach((p, i) => {
          const angle = rand2() * Math.PI * 2;
          const dist = 80 + rand2() * 280;
          tl.fromTo(p,
            { opacity: 0, scale: 0 },
            {
              opacity: 0.85,
              scale: 1,
              x: Math.cos(angle) * dist,
              y: Math.sin(angle) * dist,
              duration: 0.6 + rand2() * 0.4,
              ease: 'expo.out'
            },
            7.5 + rand2() * 0.3
          );
          tl.to(p, { opacity: 0, scale: 0, duration: 0.5, ease: 'power2.in' }, 8.2 + rand2() * 0.5);
        });

        // ── HOLD & BREATHE ───────────────────────────────────────
        // All badges subtly pulse together
        tl.to(['.badge-blue', '.badge-green', '.badge-gold'], {
          scale: 1.03,
          duration: 0.8, ease: 'sine.inOut',
          yoyo: true, repeat: Math.ceil((duration - 9) / 0.8) - 1
        }, 9.0);

        // ── FADE OUT ─────────────────────────────────────────────
        tl.to('.stage', { opacity: 0, duration: 0.6, ease: 'power2.in' }, 11.2);
        tl.to('.aurora', { opacity: 0, duration: 0.8, ease: 'power1.in' }, 11.2);

        window.__timelines['atmos-anim02'] = tl;
      </script>
    </div>
  </body>
</html>
