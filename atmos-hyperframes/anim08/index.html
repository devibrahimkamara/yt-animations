<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #030818;
        font-family: "Plus Jakarta Sans", sans-serif;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
      }

      .aurora { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .aurora-blob { position: absolute; border-radius: 50%; filter: blur(140px); }
      .blob-1 { width: 750px; height: 750px; background: rgba(20,60,220,0.6); top: -200px; left: -100px; }
      .blob-2 { width: 650px; height: 650px; background: rgba(40,90,255,0.45); bottom: -200px; right: -80px; }
      .blob-cyan { width: 400px; height: 400px; background: rgba(0,200,255,0.15); top: calc(50% - 200px); left: calc(50% - 200px); }

      /* ── STAGE ─────────────────────────────────────────────── */
      .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; }

      /* ── PROMPT AREA (Phase 1) ──────────────────────────────── */
      .prompt-area {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .prompt-label {
        font-size: 44px;
        font-weight: 700;
        color: rgba(136,170,255,0.8);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0;
      }

      .prompt-box {
        background: linear-gradient(135deg, rgba(20,40,120,0.7), rgba(8,16,60,0.85));
        border: 2px solid rgba(48,96,255,0.5);
        border-radius: 20px;
        padding: 28px 48px;
        display: flex;
        align-items: center;
        gap: 20px;
        box-shadow: 0 0 50px rgba(48,96,255,0.25), 0 0 100px rgba(48,96,255,0.1);
        opacity: 0;
        min-width: 800px;
      }

      .prompt-ai-icon {
        font-size: 40px;
        flex-shrink: 0;
      }

      .prompt-text {
        font-size: 52px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.01em;
        overflow: hidden;
        white-space: nowrap;
      }

      .cursor-blink {
        display: inline-block;
        width: 3px;
        height: 38px;
        background: #3060ff;
        margin-left: 4px;
        vertical-align: middle;
        box-shadow: 0 0 8px rgba(48,96,255,0.8);
      }

      /* ── VORTEX CANVAS ──────────────────────────────────────── */
      #vortex-canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 8;
        opacity: 0;
      }

      /* ── APP PHONE MOCKUP (Phase 3) ─────────────────────────── */
      .phone-mockup {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 12;
        opacity: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      .phone-frame {
        width: 340px;
        background: linear-gradient(160deg, rgba(15,25,80,0.95), rgba(5,10,40,0.98));
        border: 2px solid rgba(80,130,255,0.45);
        border-radius: 48px;
        padding: 32px 24px 40px;
        box-shadow:
          0 0 80px rgba(48,96,255,0.35),
          0 0 160px rgba(48,96,255,0.15),
          inset 0 1px 0 rgba(255,255,255,0.08);
        position: relative;
        overflow: hidden;
      }

      /* Phone notch */
      .phone-notch {
        width: 80px; height: 18px;
        border-radius: 10px;
        background: rgba(0,0,0,0.8);
        margin: 0 auto 20px;
      }

      /* App components — each built by particle condensation */
      .app-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        opacity: 0;
      }

      .app-icon-sm {
        width: 36px; height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, #3060ff, #22c55e);
        font-size: 18px;
        display: flex; align-items: center; justify-content: center;
      }

      .app-title-sm {
        font-size: 20px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.01em;
      }

      .app-stat-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(80,130,255,0.2);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 10px;
        opacity: 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .stat-icon { font-size: 34px; }
      .stat-content { flex: 1; }
      .stat-label { font-size: 20px; font-weight: 700; color: rgba(136,170,255,0.75); letter-spacing: 0.06em; text-transform: uppercase; }
      .stat-value { font-size: 30px; font-weight: 800; color: #ffffff; letter-spacing: -0.01em; }

      .app-cta {
        width: 100%;
        background: linear-gradient(135deg, #3060ff, #1a3fd4);
        border-radius: 14px;
        padding: 16px;
        text-align: center;
        font-size: 18px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.02em;
        margin-top: 6px;
        opacity: 0;
        box-shadow: 0 0 20px rgba(48,96,255,0.4);
      }

      /* ── COMPLETION TEXT ────────────────────────────────────── */
      .completion-text {
        text-align: center;
        opacity: 0;
      }

      .comp-label {
        font-size: 38px;
        font-weight: 600;
        color: rgba(136,170,255,0.75);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .comp-main {
        font-size: 64px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
        text-shadow: 0 0 40px rgba(48,96,255,0.6);
      }

      /* ── PARTICLES ──────────────────────────────────────────── */
      .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 9; opacity: 0; }

      /* Laser engraving effect on completion text */
      .laser-line {
        position: absolute;
        height: 2px;
        background: linear-gradient(90deg, transparent, #3060ff, transparent);
        box-shadow: 0 0 8px rgba(48,96,255,0.8);
        opacity: 0;
        z-index: 25;
      }

      /* Top meta */
      .top-meta {
        position: absolute; top: 40px; left: 50%;
        transform: translateX(-50%);
        font-size: 40px; font-weight: 700;
        color: rgba(136,170,255,0.65);
        letter-spacing: 0.16em; text-transform: uppercase;
        white-space: nowrap; z-index: 20;
      }

      /* Reg marks */
      .reg { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
      .rc { position: absolute; width: 24px; height: 24px; opacity: 0.2; }
      .rc.tl { top: 28px; left: 28px; border-top: 2px solid rgba(136,170,255,0.8); border-left: 2px solid rgba(136,170,255,0.8); }
      .rc.tr { top: 28px; right: 28px; border-top: 2px solid rgba(136,170,255,0.8); border-right: 2px solid rgba(136,170,255,0.8); }
      .rc.bl { bottom: 28px; left: 28px; border-bottom: 2px solid rgba(136,170,255,0.8); border-left: 2px solid rgba(136,170,255,0.8); }
      .rc.br { bottom: 28px; right: 28px; border-bottom: 2px solid rgba(136,170,255,0.8); border-right: 2px solid rgba(136,170,255,0.8); }
    </style>
  </head>
  <body>
    <div data-composition-id="atmos-anim08" data-start="0" data-width="1920" data-height="1080">

      <div class="aurora">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-cyan"></div>
      </div>

      <div class="reg">
        <div class="rc tl"></div><div class="rc tr"></div>
        <div class="rc bl"></div><div class="rc br"></div>
      </div>
      <div class="top-meta">L'IA crée ton application</div>

      <!-- Particles container -->
      <div id="particles" style="position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden;"></div>

      <!-- Phase 1: Prompt -->
      <div class="prompt-area" id="prompt-area">
        <div class="prompt-label" id="prompt-label">Ton prompt IA</div>
        <div class="prompt-box" id="prompt-box">
          <div class="prompt-ai-icon">🤖</div>
          <div class="prompt-text" id="prompt-text"><span id="typed-chars"></span><span class="cursor-blink" id="cursor"></span></div>
        </div>
      </div>

      <!-- Vortex SVG -->
      <svg id="vortex-canvas" width="700" height="700" viewBox="-350 -350 700 700">
        <!-- Vortex rings — animated by GSAP rotation -->
        <g id="vortex-group">
          <ellipse rx="280" ry="80" fill="none" stroke="rgba(48,96,255,0.4)" stroke-width="1.5" opacity="0.5" id="vring-1"/>
          <ellipse rx="200" ry="56" fill="none" stroke="rgba(0,200,255,0.4)" stroke-width="1.5" opacity="0.6" id="vring-2"/>
          <ellipse rx="130" ry="36" fill="none" stroke="rgba(48,96,255,0.6)" stroke-width="2" id="vring-3"/>
          <ellipse rx="70" ry="20" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" id="vring-4"/>
          <circle r="8" fill="#3060ff" opacity="0.9" id="vortex-core"/>
        </g>
      </svg>

      <!-- Phase 3: Phone mockup -->
      <div class="phone-mockup" id="phone-mockup">
        <div class="phone-frame" id="phone-frame">
          <div class="phone-notch"></div>

          <div class="app-header" id="app-header">
            <div class="app-icon-sm">✂️</div>
            <div class="app-title-sm">CoiffeurPro</div>
          </div>

          <div class="app-stat-card" id="stat-1">
            <span class="stat-icon">📅</span>
            <div class="stat-content">
              <div class="stat-label">Aujourd'hui</div>
              <div class="stat-value">8 rendez-vous</div>
            </div>
          </div>
          <div class="app-stat-card" id="stat-2">
            <span class="stat-icon">💰</span>
            <div class="stat-content">
              <div class="stat-label">Ce mois</div>
              <div class="stat-value">2 840€</div>
            </div>
          </div>
          <div class="app-stat-card" id="stat-3">
            <span class="stat-icon">⭐</span>
            <div class="stat-content">
              <div class="stat-label">Clients fidèles</div>
              <div class="stat-value">127 clients</div>
            </div>
          </div>

          <div class="app-cta" id="app-cta">+ Nouveau rendez-vous</div>
        </div>

        <div class="completion-text" id="completion-text">
          <div class="comp-label">Développement terminé</div>
          <div class="comp-main">⚡ Fait en quelques heures</div>
        </div>
      </div>

      <!-- Laser line for engraving effect -->
      <div class="laser-line" id="laser-line"></div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        const duration = 15;

        // Seeded PRNG
        function mulberry32(a) {
          return function() { a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296; }
        }
        const rand = mulberry32(88);

        // Build particles
        const pContainer = document.getElementById('particles');
        const pColors = ['#3060ff','#88aaff','#00c8ff','#ffffff','#22c55e'];
        for (let i = 0; i < 60; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          const size = 3 + rand() * 8;
          p.style.width = size + 'px';
          p.style.height = size + 'px';
          p.style.background = pColors[Math.floor(rand() * 5)];
          p.style.left = (300 + rand() * 1320) + 'px';
          p.style.top = (200 + rand() * 680) + 'px';
          p.id = 'pt' + i;
          pContainer.appendChild(p);
        }

        const promptFull = "Crée-moi une app pour salons de coiffure";
        // Build individual character spans for typewriter (no tl.call needed)
        const typedContainer = document.getElementById('typed-chars');
        promptFull.split('').forEach((ch, i) => {
          const span = document.createElement('span');
          span.textContent = ch === ' ' ? ' ' : ch;
          span.id = 'ch' + i;
          span.style.opacity = '0';
          span.style.display = 'inline-block';
          typedContainer.appendChild(span);
        });

        const tl = gsap.timeline({ paused: true });

        // Aurora
        tl.to('.blob-1', { x: 60, y: 50, duration: 3.2, ease: 'sine.inOut', yoyo: true, repeat: Math.floor(duration/3.2)-1 }, 0);
        tl.to('.blob-2', { x: -50, y: -40, duration: 3.8, ease: 'sine.inOut', yoyo: true, repeat: Math.floor(duration/3.8)-1 }, 0.5);
        tl.to('.blob-cyan', { scale: 1.6, opacity: 0.3, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: Math.floor(duration/2.5)-1 }, 0.3);

        // Reg / meta
        tl.fromTo('.reg', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power1.out' }, 0.1);
        tl.fromTo('.top-meta', { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.2);

        // ── PHASE 1: Prompt box ───────────────────────────────
        tl.fromTo('#prompt-label', { opacity: 0, y: -15 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.4);
        tl.fromTo('#prompt-box',
          { opacity: 0, scale: 0.9, y: 20 },
          { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: 'expo.out' },
          0.7
        );

        // Cursor blinks
        tl.to('#cursor', {
          opacity: 0,
          duration: 0.5, ease: 'power1.inOut',
          yoyo: true, repeat: 5
        }, 0.9);

        // Typewriter — reveal each character span sequentially (pure visual, no tl.call)
        const charCount = promptFull.length;
        const typeStart = 1.2;
        const typeDuration = 2.0;
        for (let i = 0; i < charCount; i++) {
          const t = typeStart + (i / charCount) * typeDuration;
          tl.fromTo('#ch' + i,
            { opacity: 0 },
            { opacity: 1, duration: 0.05, ease: 'none' },
            t
          );
        }

        // Cursor stops after typing
        tl.to('#cursor', {
          opacity: 1,
          duration: 0.3, ease: 'power1.out',
          yoyo: true, repeat: 3
        }, typeStart + typeDuration + 0.2);

        // Prompt box glows — thinking
        tl.to('#prompt-box', {
          boxShadow: '0 0 80px rgba(48,96,255,0.5), 0 0 160px rgba(48,96,255,0.2)',
          duration: 0.6, ease: 'power2.out'
        }, 3.5);

        // ── PROMPT SHATTERS INTO PARTICLES ───────────────────
        tl.to('#prompt-area', { opacity: 0, scale: 0.8, duration: 0.35, ease: 'power3.in' }, 4.2);
        tl.set('#prompt-area', { visibility: 'hidden' }, 4.55);

        // Particles burst from center
        const allParticles = pContainer.querySelectorAll('.particle');
        const rand2 = mulberry32(44);
        allParticles.forEach((p, i) => {
          const startX = 960 - parseInt(p.style.left);
          const startY = 540 - parseInt(p.style.top);

          tl.fromTo(p,
            { opacity: 0.9, x: startX, y: startY, scale: 0.3 },
            {
              opacity: 0.8, x: 0, y: 0, scale: 1,
              duration: 0.4 + rand2() * 0.3, ease: 'power2.out'
            },
            4.2 + rand2() * 0.3
          );
        });

        // ── VORTEX APPEARS ────────────────────────────────────
        tl.fromTo('#vortex-canvas',
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.4)' },
          4.5
        );

        // Vortex spins faster and faster
        const vortexDuration = duration - 4.5;
        tl.to('#vortex-group', {
          rotation: 360,
          duration: 1.2, ease: 'none',
          repeat: Math.floor(vortexDuration / 1.2)
        }, 4.5);

        tl.to(['#vring-1', '#vring-2', '#vring-3', '#vring-4'], {
          scaleX: 0.3, scaleY: 2,
          duration: 0.8, ease: 'power2.inOut',
          yoyo: true, repeat: Math.floor(vortexDuration / 0.8) - 1,
          stagger: 0.15
        }, 4.8);

        // Particles spiral into vortex
        allParticles.forEach((p, i) => {
          const angle = rand2() * Math.PI * 2;
          const dist = 50 + rand2() * 80;
          tl.to(p, {
            x: Math.cos(angle) * dist,
            y: Math.sin(angle) * dist,
            opacity: 0,
            scale: 0,
            duration: 0.6 + rand2() * 0.3,
            ease: 'power2.in'
          }, 5.5 + rand2() * 0.5);
        });

        // Vortex condensation — shrinks
        tl.to('#vortex-canvas', {
          scale: 0.15, opacity: 0,
          duration: 0.6, ease: 'power3.in'
        }, 6.8);

        // Cyan blob intensifies for transformation moment
        tl.to('.blob-cyan', {
          opacity: 0.5, scale: 3.5,
          duration: 0.6, ease: 'power2.out'
        }, 6.5);

        // ── PHASE 3: App materializes ─────────────────────────
        tl.fromTo('#phone-mockup',
          { opacity: 0, scale: 0.5, rotation: -5 },
          { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: 'back.out(1.6)' },
          7.3
        );

        // App components appear one by one (particle condensation feel)
        tl.fromTo('#app-header',
          { opacity: 0, y: -15 },
          { opacity: 1, y: 0, duration: 0.4, ease: 'expo.out' },
          7.8
        );
        tl.fromTo('#stat-1',
          { opacity: 0, x: -20 },
          { opacity: 1, x: 0, duration: 0.4, ease: 'back.out(1.4)' },
          8.2
        );
        tl.fromTo('#stat-2',
          { opacity: 0, x: -20 },
          { opacity: 1, x: 0, duration: 0.4, ease: 'back.out(1.4)' },
          8.5
        );
        tl.fromTo('#stat-3',
          { opacity: 0, x: -20 },
          { opacity: 1, x: 0, duration: 0.4, ease: 'back.out(1.4)' },
          8.8
        );
        tl.fromTo('#app-cta',
          { opacity: 0, scale: 0.8 },
          { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' },
          9.1
        );

        // Phone glow pulses
        tl.to('#phone-frame', {
          boxShadow: '0 0 100px rgba(48,96,255,0.55), 0 0 200px rgba(48,96,255,0.2), inset 0 1px 0 rgba(255,255,255,0.08)',
          duration: 1.2, ease: 'sine.inOut',
          yoyo: true, repeat: Math.floor((duration - 9.5) / 1.2) - 1
        }, 9.5);

        // Phone subtle float
        tl.to('#phone-mockup', {
          y: -12,
          duration: 1.8, ease: 'sine.inOut',
          yoyo: true, repeat: Math.floor((duration - 9.0) / 1.8) - 1
        }, 9.0);

        // ── LASER ENGRAVING of completion text ────────────────
        tl.fromTo('#completion-text',
          { opacity: 0 },
          { opacity: 1, duration: 0.2 },
          10.8
        );

        // Laser line sweeps across
        tl.fromTo('#laser-line',
          { opacity: 0.9, width: '0px', left: '50%', top: '870px' },
          { width: '640px', left: 'calc(50% - 320px)', duration: 0.8, ease: 'power2.inOut' },
          10.9
        );
        tl.to('#laser-line', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 11.7);

        // Completion text final glow
        tl.to('#completion-text .comp-main', {
          textShadow: '0 0 50px rgba(48,96,255,0.8)',
          duration: 0.8, ease: 'sine.inOut',
          yoyo: true, repeat: Math.floor((duration - 11.5) / 0.8) - 1
        }, 11.5);

        // Fade out
        tl.to(['#phone-mockup', '.top-meta'],
          { opacity: 0, duration: 0.6, ease: 'power2.in' }, 14.1);
        tl.to('.aurora', { opacity: 0, duration: 0.8, ease: 'power1.in' }, 14.1);

        window.__timelines['atmos-anim08'] = tl;
      </script>
    </div>
  </body>
</html>
